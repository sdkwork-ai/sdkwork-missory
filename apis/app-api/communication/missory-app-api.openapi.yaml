openapi: 3.1.0
info:
  title: SDKWork Missory App API
  version: 0.1.0
  description: >-
    Missory (念忆) app-api surface: people, relationships, memories, stories,
    reminders, and the draft-only social AI assistant. Authority contract for the
    `sdkwork-missory-app-api` API authority mounted under the locked app-api prefix.
servers:
  - url: /app/v3/api
tags:
  - name: missory
  - name: missory-assistant
paths:
  /missory/my-profile:
    get:
      operationId: myProfile.retrieve
      tags: [missory]
      summary: Retrieve the owner profile of the current user.
      responses:
        '200':
          $ref: '#/components/responses/ItemMissoryMyProfile'
        '4XX':
          $ref: '#/components/responses/Problem'
    put:
      operationId: myProfile.update
      tags: [missory]
      summary: Update the owner profile of the current user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MissoryMyProfileUpsertRequest'
      responses:
        '200':
          $ref: '#/components/responses/ItemMissoryMyProfile'
        '4XX':
          $ref: '#/components/responses/Problem'
  /missory/persons:
    post:
      operationId: persons.create
      tags: [missory]
      summary: Create a person.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MissoryPersonUpsertRequest'
      responses:
        '201':
          $ref: '#/components/responses/ItemMissoryPerson'
        '4XX':
          $ref: '#/components/responses/Problem'
    get:
      operationId: persons.list
      tags: [missory]
      summary: List persons with optional keyword and relationship-type filters.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Q'
        - name: relationshipType
          in: query
          schema:
            $ref: '#/components/schemas/MissoryRelationshipType'
      responses:
        '200':
          $ref: '#/components/responses/PageMissoryPerson'
        '4XX':
          $ref: '#/components/responses/Problem'
  /missory/persons/{personId}:
    parameters:
      - $ref: '#/components/parameters/PersonId'
    get:
      operationId: persons.retrieve
      tags: [missory]
      summary: Retrieve a person with relationships, recent memories, and stats.
      responses:
        '200':
          $ref: '#/components/responses/ItemMissoryPersonDetail'
        '4XX':
          $ref: '#/components/responses/Problem'
    put:
      operationId: persons.update
      tags: [missory]
      summary: Update a person.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MissoryPersonUpsertRequest'
      responses:
        '200':
          $ref: '#/components/responses/ItemMissoryPerson'
        '4XX':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: persons.delete
      tags: [missory]
      summary: Delete a person and its owned relationships and memory links.
      responses:
        '204':
          description: Deleted; no JSON body.
        '4XX':
          $ref: '#/components/responses/Problem'
  /missory/persons/{personId}/timeline:
    parameters:
      - $ref: '#/components/parameters/PersonId'
    get:
      operationId: persons.timeline.list
      tags: [missory]
      summary: Relationship timeline for one person.
      responses:
        '200':
          $ref: '#/components/responses/PageMissoryTimelineEntry'
        '4XX':
          $ref: '#/components/responses/Problem'
  /missory/persons/{personId}/relationships:
    parameters:
      - $ref: '#/components/parameters/PersonId'
    post:
      operationId: relationships.create
      tags: [missory]
      summary: Add or update the owner-to-person relationship.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MissoryRelationshipUpsertRequest'
      responses:
        '201':
          $ref: '#/components/responses/ItemMissoryRelationship'
        '4XX':
          $ref: '#/components/responses/Problem'
  /missory/persons/{personId}/relationships/{relationshipId}:
    parameters:
      - $ref: '#/components/parameters/PersonId'
      - $ref: '#/components/parameters/RelationshipId'
    delete:
      operationId: relationships.delete
      tags: [missory]
      summary: Remove one relationship edge.
      responses:
        '204':
          description: Deleted; no JSON body.
        '4XX':
          $ref: '#/components/responses/Problem'
  /missory/memories:
    post:
      operationId: memories.create
      tags: [missory]
      summary: Record a memory manually.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MissoryMemoryUpsertRequest'
      responses:
        '201':
          $ref: '#/components/responses/ItemMissoryMemory'
        '4XX':
          $ref: '#/components/responses/Problem'
    get:
      operationId: memories.list
      tags: [missory]
      summary: List memories with person/type/status/origin/keyword filters.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Q'
        - name: personId
          in: query
          schema:
            $ref: '#/components/schemas/Int64Id'
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/MissoryMemoryType'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/MissoryMemoryStatus'
        - name: origin
          in: query
          schema:
            $ref: '#/components/schemas/MissoryMemoryOrigin'
      responses:
        '200':
          $ref: '#/components/responses/PageMissoryMemory'
        '4XX':
          $ref: '#/components/responses/Problem'
  /missory/memories/extract:
    post:
      operationId: memories.extract
      tags: [missory]
      summary: Extract candidate memories from free text (AI assist, candidates only).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MissoryMemoryExtractRequest'
      responses:
        '200':
          $ref: '#/components/responses/PageMissoryMemory'
        '4XX':
          $ref: '#/components/responses/Problem'
  /missory/memories/{memoryId}:
    parameters:
      - $ref: '#/components/parameters/MemoryId'
    get:
      operationId: memories.retrieve
      tags: [missory]
      summary: Retrieve one memory including source and inference metadata.
      responses:
        '200':
          $ref: '#/components/responses/ItemMissoryMemory'
        '4XX':
          $ref: '#/components/responses/Problem'
    put:
      operationId: memories.update
      tags: [missory]
      summary: Update one memory.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MissoryMemoryUpsertRequest'
      responses:
        '200':
          $ref: '#/components/responses/ItemMissoryMemory'
        '4XX':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: memories.delete
      tags: [missory]
      summary: Delete one memory.
      responses:
        '204':
          description: Deleted; no JSON body.
        '4XX':
          $ref: '#/components/responses/Problem'
  /missory/memories/{memoryId}/confirm:
    parameters:
      - $ref: '#/components/parameters/MemoryId'
    post:
      operationId: memories.confirm
      tags: [missory]
      summary: Confirm a candidate or inference memory into a user-confirmed fact.
      responses:
        '200':
          $ref: '#/components/responses/CommandAccepted'
        '4XX':
          $ref: '#/components/responses/Problem'
  /missory/memories/{memoryId}/reject:
    parameters:
      - $ref: '#/components/parameters/MemoryId'
    post:
      operationId: memories.reject
      tags: [missory]
      summary: Reject a candidate or inference memory.
      responses:
        '200':
          $ref: '#/components/responses/CommandAccepted'
        '4XX':
          $ref: '#/components/responses/Problem'
  /missory/stories:
    post:
      operationId: stories.create
      tags: [missory]
      summary: Create a story bundling participants, events, and memories.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MissoryStoryUpsertRequest'
      responses:
        '201':
          $ref: '#/components/responses/ItemMissoryStory'
        '4XX':
          $ref: '#/components/responses/Problem'
    get:
      operationId: stories.list
      tags: [missory]
      summary: List stories.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Q'
      responses:
        '200':
          $ref: '#/components/responses/PageMissoryStory'
        '4XX':
          $ref: '#/components/responses/Problem'
  /missory/stories/{storyId}:
    parameters:
      - $ref: '#/components/parameters/StoryId'
    get:
      operationId: stories.retrieve
      tags: [missory]
      summary: Retrieve one story with its timeline.
      responses:
        '200':
          $ref: '#/components/responses/ItemMissoryStory'
        '4XX':
          $ref: '#/components/responses/Problem'
    put:
      operationId: stories.update
      tags: [missory]
      summary: Update one story.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MissoryStoryUpsertRequest'
      responses:
        '200':
          $ref: '#/components/responses/ItemMissoryStory'
        '4XX':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: stories.delete
      tags: [missory]
      summary: Delete one story.
      responses:
        '204':
          description: Deleted; no JSON body.
        '4XX':
          $ref: '#/components/responses/Problem'
  /missory/stories/{storyId}/summaries:
    parameters:
      - $ref: '#/components/parameters/StoryId'
    post:
      operationId: stories.summaries.create
      tags: [missory-assistant]
      summary: Create (or regenerate) the AI summary of a story.
      responses:
        '201':
          $ref: '#/components/responses/ItemMissoryStory'
        '4XX':
          $ref: '#/components/responses/Problem'
  /missory/reminders:
    get:
      operationId: reminders.list
      tags: [missory]
      summary: List derived reminders (long-uncontacted, birthday, commitment, events).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/MissoryReminderType'
      responses:
        '200':
          $ref: '#/components/responses/PageMissoryReminder'
        '4XX':
          $ref: '#/components/responses/Problem'
  /missory/reminders/{reminderId}/dismiss:
    parameters:
      - $ref: '#/components/parameters/ReminderId'
    post:
      operationId: reminders.dismiss
      tags: [missory]
      summary: Dismiss a derived reminder.
      responses:
        '200':
          $ref: '#/components/responses/CommandAccepted'
        '4XX':
          $ref: '#/components/responses/Problem'
  /missory/reminders/{reminderId}/snooze:
    parameters:
      - $ref: '#/components/parameters/ReminderId'
    post:
      operationId: reminders.snooze
      tags: [missory]
      summary: Snooze a derived reminder for a number of days.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MissoryReminderSnoozeRequest'
      responses:
        '200':
          $ref: '#/components/responses/CommandAccepted'
        '4XX':
          $ref: '#/components/responses/Problem'
  /missory/home/today:
    get:
      operationId: home.today.list
      tags: [missory]
      summary: Home digest — today relations, recent memories, recent persons.
      responses:
        '200':
          $ref: '#/components/responses/ItemMissoryHomeDigest'
        '4XX':
          $ref: '#/components/responses/Problem'
  /missory/assistant/query:
    post:
      operationId: assistant.query
      tags: [missory-assistant]
      summary: Ask the social agent a person/relationship/memory question.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MissoryAssistantQueryRequest'
      responses:
        '200':
          $ref: '#/components/responses/ItemMissoryAssistantAnswer'
        '4XX':
          $ref: '#/components/responses/Problem'
  /missory/assistant/briefings:
    post:
      operationId: assistant.briefings.create
      tags: [missory-assistant]
      summary: Build a meeting briefing for one person.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MissoryBriefingRequest'
      responses:
        '201':
          $ref: '#/components/responses/ItemMissoryBriefing'
        '4XX':
          $ref: '#/components/responses/Problem'
  /missory/assistant/message-drafts:
    post:
      operationId: assistant.messageDrafts.create
      tags: [missory-assistant]
      summary: Draft a message (birthday, check-in) — draft only, never auto-sent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MissoryMessageDraftRequest'
      responses:
        '201':
          $ref: '#/components/responses/ItemMissoryMessageDraft'
        '4XX':
          $ref: '#/components/responses/Problem'
  /missory/assistant/chat-summaries:
    post:
      operationId: assistant.chatSummaries.create
      tags: [missory-assistant]
      summary: Summarize pasted chat text and produce candidate memories.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MissoryChatSummaryRequest'
      responses:
        '201':
          $ref: '#/components/responses/ItemMissoryChatSummary'
        '4XX':
          $ref: '#/components/responses/Problem'
components:
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        format: int32
        default: 1
        minimum: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        format: int32
        default: 20
        minimum: 1
        maximum: 200
    Q:
      name: q
      in: query
      schema:
        type: string
    PersonId:
      name: personId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Int64Id'
    RelationshipId:
      name: relationshipId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Int64Id'
    MemoryId:
      name: memoryId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Int64Id'
    StoryId:
      name: storyId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Int64Id'
    ReminderId:
      name: reminderId
      in: path
      required: true
      schema:
        type: string
  responses:
    Problem:
      description: RFC 9457 problem detail.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    CommandAccepted:
      description: Command accepted.
      content:
        application/json:
          schema:
            type: object
            required: [code, data, traceId]
            properties:
              code:
                type: integer
                const: 0
              data:
                $ref: '#/components/schemas/SdkWorkCommandData'
              traceId:
                type: string
    ItemMissoryMyProfile:
      description: Owner profile.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MissoryMyProfileEnvelope'
    ItemMissoryPerson:
      description: Person resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MissoryPersonEnvelope'
    PageMissoryPerson:
      description: Person page.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MissoryPersonPageEnvelope'
    ItemMissoryPersonDetail:
      description: Person detail resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MissoryPersonDetailEnvelope'
    PageMissoryTimelineEntry:
      description: Timeline page.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MissoryTimelineEntryPageEnvelope'
    ItemMissoryRelationship:
      description: Relationship resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MissoryRelationshipEnvelope'
    ItemMissoryMemory:
      description: Memory resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MissoryMemoryEnvelope'
    PageMissoryMemory:
      description: Memory page.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MissoryMemoryPageEnvelope'
    ItemMissoryStory:
      description: Story resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MissoryStoryEnvelope'
    PageMissoryStory:
      description: Story page.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MissoryStoryPageEnvelope'
    PageMissoryReminder:
      description: Reminder page.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MissoryReminderPageEnvelope'
    ItemMissoryHomeDigest:
      description: Home digest resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MissoryHomeDigestEnvelope'
    ItemMissoryAssistantAnswer:
      description: Assistant answer.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MissoryAssistantAnswerEnvelope'
    ItemMissoryBriefing:
      description: Meeting briefing.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MissoryBriefingEnvelope'
    ItemMissoryMessageDraft:
      description: Message draft (never auto-sent).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MissoryMessageDraftEnvelope'
    ItemMissoryChatSummary:
      description: Chat summary with candidate memories.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MissoryChatSummaryEnvelope'
  schemas:
    Int64Id:
      type: string
      format: int64
      pattern: '^-?[0-9]+$'
      x-sdkwork-int64-string: true
    ProblemDetail:
      type: object
      required: [type, title, status, detail, code, traceId]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: integer
        traceId:
          type: string
        instance:
          type: string
    SdkWorkCommandData:
      type: object
      required: [accepted]
      properties:
        accepted:
          type: boolean
        resourceId:
          type: string
        status:
          type: string
    MissoryRelationshipType:
      type: string
      enum:
        - family
        - friend
        - classmate
        - colleague
        - client
        - partner
        - teacher
        - student
        - neighbor
        - spouse
        - other
    MissoryImportance:
      type: string
      enum: [low, normal, high, core]
    MissoryMemoryType:
      type: string
      enum:
        - semantic
        - episodic
        - temporal
        - relationship
        - preference
        - commitment
    MissoryMemoryStatus:
      type: string
      enum: [candidate, confirmed, rejected, archived, expired]
    MissoryMemoryOrigin:
      type: string
      enum: [fact, inference]
    MissorySourceKind:
      type: string
      enum:
        - user-input
        - file
        - conversation
        - ai-extraction
        - ai-inference
        - system
    MissoryReminderType:
      type: string
      enum: [long-uncontacted, birthday, commitment, important-event, anniversary]
    MissoryMessageTone:
      type: string
      enum: [brief, natural, warm, humorous, formal, friendly]
    MissoryAssistantScenario:
      type: string
      enum: [birthday, check-in, congratulations, thank-you, custom]
    MissoryPersonRequestContext:
      type: object
      description: Resolved request identity (never client-writable at create/update bodies).
      required: [tenantId, userId]
      properties:
        tenantId:
          $ref: '#/components/schemas/Int64Id'
        organizationId:
          $ref: '#/components/schemas/Int64Id'
        userId:
          $ref: '#/components/schemas/Int64Id'
    MissoryMyProfile:
      type: object
      required: [userId, displayName, updatedAt]
      properties:
        userId:
          $ref: '#/components/schemas/Int64Id'
        displayName:
          type: string
        nickname:
          type: string
        city:
          type: string
        occupation:
          type: string
        company:
          type: string
        education:
          type: string
        interests:
          type: array
          items:
            type: string
        likes:
          type: array
          items:
            type: string
        dislikes:
          type: array
          items:
            type: string
        communicationStyle:
          type: string
        bio:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    MissoryMyProfileEnvelope:
      type: object
      required: [code, data, traceId]
      properties:
        code:
          type: integer
          const: 0
        data:
          type: object
          required: [item]
          properties:
            item:
              $ref: '#/components/schemas/MissoryMyProfile'
        traceId:
          type: string
    MissoryMyProfileUpsertRequest:
      type: object
      additionalProperties: false
      properties:
        displayName:
          type: string
        nickname:
          type: string
        city:
          type: string
        occupation:
          type: string
        company:
          type: string
        education:
          type: string
        interests:
          type: array
          items:
            type: string
        likes:
          type: array
          items:
            type: string
        dislikes:
          type: array
          items:
            type: string
        communicationStyle:
          type: string
        bio:
          type: string
    MissoryPerson:
      type: object
      required: [id, displayName, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/Int64Id'
        displayName:
          type: string
        aliases:
          type: array
          items:
            type: string
        gender:
          type: string
        birthday:
          type: string
          description: 'MM-DD or full date; drives birthday reminders.'
        city:
          type: string
        title:
          type: string
        company:
          type: string
        avatarUrl:
          type: string
        tags:
          type: array
          items:
            type: string
        interests:
          type: array
          items:
            type: string
        preferences:
          type: array
          items:
            type: string
        bio:
          type: string
        contactChannels:
          type: object
          additionalProperties:
            type: string
        notes:
          type: string
        lastContactedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    MissoryPersonEnvelope:
      type: object
      required: [code, data, traceId]
      properties:
        code:
          type: integer
          const: 0
        data:
          type: object
          required: [item]
          properties:
            item:
              $ref: '#/components/schemas/MissoryPerson'
        traceId:
          type: string
    MissoryPersonPageEnvelope:
      type: object
      required: [code, data, traceId]
      properties:
        code:
          type: integer
          const: 0
        data:
          type: object
          required: [items, pageInfo]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/MissoryPerson'
            pageInfo:
              $ref: '#/components/schemas/PageInfo'
        traceId:
          type: string
    MissoryRelationship:
      type: object
      required: [id, personId, relationshipTypes, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/Int64Id'
        personId:
          $ref: '#/components/schemas/Int64Id'
        relationshipTypes:
          type: array
          items:
            $ref: '#/components/schemas/MissoryRelationshipType'
        startedAt:
          type: string
          format: date-time
        lastContactedAt:
          type: string
          format: date-time
        description:
          type: string
        importance:
          $ref: '#/components/schemas/MissoryImportance'
        contactCycleDays:
          type: integer
